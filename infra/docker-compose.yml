services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: upcraft
      POSTGRES_USER: upcraft
      POSTGRES_PASSWORD: upcraft
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upcraft -d upcraft"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - valkey-data:/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: upcraft-local
      MINIO_ROOT_PASSWORD: upcraft-local-secret
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 upcraft-local upcraft-local-secret; do sleep 2; done
        mc mb --ignore-existing local/upcraft-private
        mc anonymous set none local/upcraft-private

volumes:
  postgres-data:
  valkey-data:
  minio-data:
